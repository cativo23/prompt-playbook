# Config de nginx para nospoon.cativo.dev.
#
# El problema que arregla: sin cabecera Cache-Control, nginx solo manda ETag y
# Last-Modified. El navegador entonces aplica *caché heurística* — se guarda el
# archivo por su cuenta, típicamente un 10% del tiempo transcurrido desde la última
# modificación, y durante ese rato lo sirve sin preguntar. Resultado: publicás una
# versión nueva y el usuario sigue viendo la vieja.
#
# `no-cache` NO significa "no guardar". Significa "guardá, pero revalidá siempre
# antes de usar". Con el ETag ya presente, esa revalidación es un 304 vacío: unos
# pocos bytes. Para un sitio de ~120 KB sin build ni assets versionados, es la
# opción correcta — siempre al día, y casi sin costo.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nada de tipos MIME adivinados.
    charset utf-8;
    types_hash_max_size 4096;

    # Revalidar siempre. Aplica a html, js, css y todo lo demás.
    add_header Cache-Control "no-cache" always;

    # Un poco de higiene básica.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets NO deben caer al index: si falta un .js, tiene que dar 404.
    # Con el fallback, un archivo borrado devolvía 200 con HTML adentro y el
    # error se volvía imposible de ver.
    location /assets/ {
        try_files $uri =404;
    }
}
