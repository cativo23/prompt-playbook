name: prompt-playbook

services:
  app:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - traefik.http.routers.nospoon.rule=Host(`nospoon.cativo.dev`)
      - "traefik.http.routers.nospoon.entrypoints=websecure"
      - "traefik.http.routers.nospoon.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.nospoon.loadbalancer.server.port=80"
      - "traefik.docker.network=space-server_web"
    networks:
      - space-server_web

networks:
  space-server_web:
    external: true
